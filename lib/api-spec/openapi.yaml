components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    DeepHealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        db:
          type: string
          enum: [ok, error]
        uptime:
          type: integer
      required:
        - status
        - db
        - uptime

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    # ── Users ──────────────────────────────────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: string
        clerkId:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        fullName:
          type: ["string", "null"]
        nationality:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        role:
          type: string
          enum: [guest, host, admin]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - clerkId
        - email
        - role
        - createdAt
        - updatedAt

    UserSyncInput:
      type: object
      properties:
        email:
          type: string
          format: email
        fullName:
          type: string
        avatarUrl:
          type: string
        phone:
          type: string
        nationality:
          type: string
      required:
        - email

    UserSyncResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        created:
          type: boolean
      required:
        - user
        - created

    MeResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
      required:
        - user

    UserListResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
      required:
        - users
        - total

    RoleUpdate:
      type: object
      properties:
        role:
          type: string
          enum: [guest, host, admin]
      required:
        - role

    # ── Categories ─────────────────────────────────────────────────────────────
    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        iconUrl:
          type: ["string", "null"]
        sortOrder:
          type: integer
      required:
        - id
        - name
        - slug
        - sortOrder

    CategoryListResponse:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
      required:
        - categories

    BookingTemplate:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        durationHours:
          type: integer
        description:
          type: ["string", "null"]
        isActive:
          type: boolean
        sortOrder:
          type: integer
      required:
        - id
        - name
        - durationHours
        - isActive
        - sortOrder

    BookingTemplateListResponse:
      type: object
      properties:
        templates:
          type: array
          items:
            $ref: "#/components/schemas/BookingTemplate"
      required:
        - templates

    AddOn:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        priceEgp:
          type: string
        isActive:
          type: boolean
      required:
        - id
        - name
        - priceEgp
        - isActive

    AddOnListResponse:
      type: object
      properties:
        addOns:
          type: array
          items:
            $ref: "#/components/schemas/AddOn"
      required:
        - addOns

    ExchangeRateResponse:
      type: object
      properties:
        pair:
          type: string
        rate:
          type: number
        fetchedAt:
          type: string
      required:
        - pair
        - rate
        - fetchedAt

    # ── Yachts ─────────────────────────────────────────────────────────────────
    Yacht:
      type: object
      properties:
        id:
          type: string
        hostId:
          type: string
        categoryId:
          type: ["string", "null"]
        title:
          type: string
        description:
          type: ["string", "null"]
        location:
          type: string
        city:
          type: string
        capacity:
          type: integer
        lengthFt:
          type: ["string", "null"]
        yearBuilt:
          type: ["integer", "null"]
        manufacturer:
          type: ["string", "null"]
        features:
          type: array
          items:
            type: string
        status:
          type: string
        avgRating:
          type: string
        reviewCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - hostId
        - title
        - location
        - city
        - capacity
        - status
        - avgRating
        - reviewCount
        - createdAt
        - updatedAt

    YachtDetail:
      type: object
      properties:
        yacht:
          $ref: "#/components/schemas/Yacht"
        photos:
          type: array
          items:
            $ref: "#/components/schemas/YachtPhoto"
        pricing:
          type: array
          items:
            $ref: "#/components/schemas/YachtPricing"
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        host:
          $ref: "#/components/schemas/HostPublic"
      required:
        - yacht
        - photos
        - pricing
        - reviews

    YachtPhoto:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        isPrimary:
          type: boolean
        sortOrder:
          type: integer
      required:
        - id
        - url
        - isPrimary
        - sortOrder

    YachtPricing:
      type: object
      properties:
        templateId:
          type: string
        templateName:
          type: string
        durationHours:
          type: integer
        priceEgp:
          type: string
      required:
        - templateId
        - templateName
        - durationHours
        - priceEgp

    YachtListResponse:
      type: object
      properties:
        yachts:
          type: array
          items:
            $ref: "#/components/schemas/Yacht"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - yachts
        - total
        - page
        - limit

    YachtInput:
      type: object
      properties:
        title:
          type: string
          minLength: 3
        description:
          type: string
        location:
          type: string
        categoryId:
          type: string
        capacity:
          type: integer
          minimum: 1
        lengthFt:
          type: number
        yearBuilt:
          type: integer
        manufacturer:
          type: string
        features:
          type: array
          items:
            type: string
      required:
        - title
        - location
        - capacity

    YachtUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        location:
          type: string
        categoryId:
          type: string
        capacity:
          type: integer
        features:
          type: array
          items:
            type: string

    # ── Availability ───────────────────────────────────────────────────────────
    AvailabilitySlot:
      type: object
      properties:
        id:
          type: string
        yachtId:
          type: string
        templateId:
          type: string
        date:
          type: string
        startTime:
          type: string
        isAvailable:
          type: boolean
      required:
        - id
        - yachtId
        - templateId
        - date
        - startTime
        - isAvailable

    AvailabilityListResponse:
      type: object
      properties:
        slots:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilitySlot"
      required:
        - slots

    AvailabilityBatchInput:
      type: object
      properties:
        slots:
          type: array
          items:
            type: object
            properties:
              templateId:
                type: string
              date:
                type: string
              startTime:
                type: string
              isAvailable:
                type: boolean
            required:
              - templateId
              - date
              - startTime
              - isAvailable
      required:
        - slots

    PricingItem:
      type: object
      properties:
        templateId:
          type: string
        priceEgp:
          type: string
      required:
        - templateId
        - priceEgp

    PricingBatchInput:
      type: object
      properties:
        pricing:
          type: array
          items:
            $ref: "#/components/schemas/PricingItem"
      required:
        - pricing

    PricingListResponse:
      type: object
      properties:
        pricing:
          type: array
          items:
            $ref: "#/components/schemas/YachtPricing"
      required:
        - pricing

    # ── Bookings ────────────────────────────────────────────────────────────────
    Booking:
      type: object
      properties:
        id:
          type: string
        guestId:
          type: string
        yachtId:
          type: string
        templateId:
          type: string
        bookingDate:
          type: string
        startTime:
          type: string
        guestCount:
          type: integer
        guestName:
          type: string
        guestPhone:
          type: string
        guestEmail:
          type: string
        guestNationality:
          type: ["string", "null"]
        specialRequests:
          type: ["string", "null"]
        baseAmountEgp:
          type: string
        totalAmountEgp:
          type: string
        platformFeeEgp:
          type: string
        hostEarningsEgp:
          type: string
        status:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - guestId
        - yachtId
        - templateId
        - bookingDate
        - startTime
        - guestCount
        - guestName
        - guestPhone
        - guestEmail
        - baseAmountEgp
        - totalAmountEgp
        - platformFeeEgp
        - hostEarningsEgp
        - status
        - createdAt
        - updatedAt

    BookingInput:
      type: object
      properties:
        yachtId:
          type: string
        templateId:
          type: string
        bookingDate:
          type: string
        startTime:
          type: string
        guestCount:
          type: integer
          minimum: 1
        guestName:
          type: string
        guestPhone:
          type: string
        guestEmail:
          type: string
          format: email
        guestNationality:
          type: string
        specialRequests:
          type: string
        addOnIds:
          type: array
          items:
            type: string
      required:
        - yachtId
        - templateId
        - bookingDate
        - startTime
        - guestCount
        - guestName
        - guestPhone
        - guestEmail

    BookingCreateResponse:
      type: object
      properties:
        booking:
          $ref: "#/components/schemas/Booking"
        clientSecret:
          type: string
        paymentIntentId:
          type: string
      required:
        - booking
        - clientSecret
        - paymentIntentId

    BookingListResponse:
      type: object
      properties:
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        total:
          type: integer
        page:
          type: integer
      required:
        - bookings
        - total
        - page

    CancellationInput:
      type: object
      properties:
        reason:
          type: string

    RejectionInput:
      type: object
      properties:
        reason:
          type: string

    # ── Reviews ─────────────────────────────────────────────────────────────────
    Review:
      type: object
      properties:
        id:
          type: string
        bookingId:
          type: string
        reviewerId:
          type: string
        revieweeId:
          type: string
        yachtId:
          type: ["string", "null"]
        rating:
          type: integer
        comment:
          type: ["string", "null"]
        type:
          type: string
        status:
          type: string
        createdAt:
          type: string
      required:
        - id
        - bookingId
        - reviewerId
        - revieweeId
        - rating
        - type
        - status
        - createdAt

    ReviewInput:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        type:
          type: string
          enum: [guest_to_host, host_to_guest]
      required:
        - rating
        - type

    ReviewListResponse:
      type: object
      properties:
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        total:
          type: integer
      required:
        - reviews
        - total

    ReviewModerationInput:
      type: object
      properties:
        status:
          type: string
          enum: [approved, rejected, hidden]
        reason:
          type: string
      required:
        - status

    # ── Host ───────────────────────────────────────────────────────────────────
    HostProfile:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        bio:
          type: ["string", "null"]
        verificationStatus:
          type: string
          enum: [pending, verified, rejected]
        stripeConnectId:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - userId
        - verificationStatus
        - createdAt

    HostPublic:
      type: object
      properties:
        id:
          type: string
        fullName:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        memberSince:
          type: string
      required:
        - id
        - memberSince

    HostApplicationInput:
      type: object
      properties:
        bio:
          type: string
      required:
        - bio

    HostProfileUpdate:
      type: object
      properties:
        bio:
          type: string

    HostProfileListResponse:
      type: object
      properties:
        hosts:
          type: array
          items:
            $ref: "#/components/schemas/HostProfile"
        total:
          type: integer
      required:
        - hosts
        - total

    HostVerificationInput:
      type: object
      properties:
        status:
          type: string
          enum: [verified, rejected]
        reason:
          type: string
      required:
        - status

    HostDocument:
      type: object
      properties:
        id:
          type: string
        hostId:
          type: string
        documentType:
          type: string
        fileUrl:
          type: string
        status:
          type: string
        createdAt:
          type: string
      required:
        - id
        - hostId
        - documentType
        - fileUrl
        - status
        - createdAt

    DocumentInput:
      type: object
      properties:
        documentType:
          type: string
          enum: [national_id, yacht_ownership, yacht_license, insurance]
        fileUrl:
          type: string
      required:
        - documentType
        - fileUrl

    PhotographerRequest:
      type: object
      properties:
        id:
          type: string
        hostId:
          type: string
        yachtId:
          type: ["string", "null"]
        preferredDate:
          type: ["string", "null"]
        preferredTime:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        status:
          type: string
        createdAt:
          type: string
      required:
        - id
        - hostId
        - status
