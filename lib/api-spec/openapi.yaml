openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: MARSA Yacht Booking API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and user account sync
  - name: yachts
    description: Yacht listing and discovery
  - name: bookings
    description: Booking management
  - name: host
    description: Host management
  - name: admin
    description: Admin operations
  - name: reviews
    description: Reviews
  - name: notifications
    description: Notifications
  - name: finance
    description: Earnings and withdrawals
  - name: discovery
    description: Guest discovery and locations
  - name: wishlist
    description: Guest wishlist
  - name: payments
    description: Payment gateway configuration

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Liveness check
      description: Returns server liveness status (no DB probe)
      responses:
        "200":
          description: Server is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /health:
    get:
      operationId: healthCheckDeep
      tags: [health]
      summary: Deep health check
      description: Validates DB connectivity. Returns 503 if unhealthy.
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeepHealthStatus"
        "503":
          description: Unhealthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeepHealthStatus"

  # ── Auth ────────────────────────────────────────────────────────────────────
  /auth/sync:
    post:
      operationId: syncUser
      tags: [auth]
      summary: Sync Clerk user to local database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSyncInput"
      responses:
        "200":
          description: User synced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSyncResponse"
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSyncResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Discovery ──────────────────────────────────────────────────────────────
  /yachts:
    get:
      operationId: listYachts
      tags: [yachts]
      summary: List live yachts
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: categoryId
          in: query
          schema: { type: string }
        - name: locationId
          in: query
          schema: { type: string }
        - name: intent
          in: query
          schema:
            type: string
            enum: [rent, buy]
            default: rent
        - name: capacity
          in: query
          schema: { type: integer }
        - name: date
          in: query
          description: Filter by availability date (YYYY-MM-DD)
          schema: { type: string }
        - name: templateId
          in: query
          schema: { type: string }
        - name: minPrice
          in: query
          description: Minimum price in EGP (inclusive)
          schema: { type: number }
        - name: maxPrice
          in: query
          description: Maximum price in EGP (inclusive)
          schema: { type: number }
        - name: features
          in: query
          description: Comma-separated list of required features e.g. "wifi,ac"
          schema: { type: string }
      responses:
        "200":
          description: List of yachts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YachtListResponse"

  /yachts/{id}:
    get:
      operationId: getYacht
      tags: [yachts]
      summary: Get yacht details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Yacht detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YachtDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /yachts/{id}/slots:
    get:
      operationId: getYachtSlots
      tags: [yachts]
      summary: Get available slots for a yacht (path-param version)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
        - name: templateId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Available slots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityListResponse"

  /yachts/availability:
    get:
      operationId: getYachtAvailability
      tags: [yachts]
      summary: Get available slots for a yacht
      parameters:
        - name: yachtId
          in: query
          required: true
          schema: { type: string }
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Available slots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityListResponse"

  /categories:
    get:
      operationId: listCategories
      tags: [yachts]
      summary: List yacht categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"

  /booking-templates:
    get:
      operationId: listBookingTemplates
      tags: [yachts]
      summary: List all booking duration templates
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingTemplateListResponse"

  /add-ons:
    get:
      operationId: listAddOns
      tags: [yachts]
      summary: List all available add-ons
      responses:
        "200":
          description: Add-ons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddOnListResponse"

  /exchange-rate:
    get:
      operationId: getExchangeRate
      tags: [yachts]
      summary: Get current USD/EGP exchange rate
      responses:
        "200":
          description: Exchange rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeRateResponse"

  /locations:
    get:
      operationId: listLocations
      tags: [discovery]
      summary: List active booking locations
      responses:
        "200":
          description: Active locations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationListResponse"

  /discovery/home:
    get:
      operationId: getDiscoveryHome
      tags: [discovery]
      summary: Get location-grouped guest Home content
      responses:
        "200":
          description: Discovery rails
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryHomeResponse"

  /wishlist:
    get:
      operationId: listWishlist
      tags: [wishlist]
      summary: List the current guest's live wishlist yachts
      responses:
        "200":
          description: Wishlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistResponse"

  /wishlist/ids:
    get:
      operationId: listWishlistIds
      tags: [wishlist]
      summary: List live wishlisted yacht IDs
      responses:
        "200":
          description: Wishlist IDs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistIdsResponse"

  /wishlist/{yachtId}:
    parameters:
      - name: yachtId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: addWishlistItem
      tags: [wishlist]
      summary: Add a live yacht to the wishlist
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistMutationResponse"
    delete:
      operationId: removeWishlistItem
      tags: [wishlist]
      summary: Remove a yacht from the wishlist
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistMutationResponse"

  /payments/config:
    get:
      operationId: getPaymentConfig
      tags: [payments]
      summary: Get the selected server payment gateway configuration
      responses:
        "200":
          description: Payment configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentConfig"

  /cancellation-policy/current:
    get:
      operationId: getCurrentCancellationPolicy
      tags: [bookings]
      summary: Get the active customer-facing cancellation policy
      responses:
        "200":
          description: Active cancellation policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancellationPolicy"
        "503":
          description: No active policy is configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Bookings ────────────────────────────────────────────────────────────────
  /bookings/me:
    get:
      operationId: getMyBookings
      tags: [bookings]
      summary: Get the current guest's bookings (dedicated alias)
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        "200":
          description: Guest bookings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings:
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a booking and get Stripe PaymentIntent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingCreateResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listMyBookings
      tags: [bookings]
      summary: List the current user's bookings
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [guest, host]
        - name: status
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        "200":
          description: Bookings list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingListResponse"

  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get booking details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Booking detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings/{id}/cancellation-quote:
    get:
      operationId: getBookingCancellationQuote
      tags: [bookings]
      summary: Get a fresh server-calculated cancellation quote
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Cancellation quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancellationQuote"
        "404":
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings/{id}/cancel:
    post:
      operationId: cancelBooking
      tags: [bookings]
      summary: Request booking cancellation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancellationInput"
      responses:
        "200":
          description: Cancellation requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingCancellation"
        "409":
          description: Quote changed before confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancellationQuoteConflict"

  /bookings/{id}/confirm:
    post:
      operationId: confirmBooking
      tags: [bookings]
      summary: Host confirms a booking
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /bookings/{id}/reject:
    post:
      operationId: rejectBooking
      tags: [bookings]
      summary: Host rejects a booking (triggers refund)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectionInput"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /bookings/{id}/review:
    post:
      operationId: submitReview
      tags: [reviews]
      summary: Submit a review for a completed booking
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Review submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  # ── Host ───────────────────────────────────────────────────────────────────
  /host/apply:
    post:
      operationId: applyAsHost
      tags: [host]
      summary: Apply to become a host
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostApplicationInput"
      responses:
        "201":
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostProfile"

  /host/profile:
    get:
      operationId: getHostProfile
      tags: [host]
      summary: Get authenticated host's profile
      responses:
        "200":
          description: Host profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostProfile"
    patch:
      operationId: updateHostProfile
      tags: [host]
      summary: Update host profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostProfileUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostProfile"

  /host/yachts:
    get:
      operationId: listHostYachts
      tags: [host]
      summary: List the host's own yachts
      responses:
        "200":
          description: Host yachts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YachtListResponse"
    post:
      operationId: createYacht
      tags: [host]
      summary: Create a new yacht listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YachtInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Yacht"

  /host/yachts/{id}:
    get:
      operationId: getHostYacht
      tags: [host]
      summary: Get an owned yacht in any workflow status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Owned yacht detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YachtDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateYacht
      tags: [host]
      summary: Update a yacht listing
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YachtUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Yacht"
    delete:
      operationId: deleteHostYacht
      tags: [host]
      summary: Delete a draft or changes_requested yacht
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"
        "400":
          description: Yacht cannot be deleted in current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /host/yacht-availability:
    get:
      operationId: getHostYachtAvailability
      tags: [host]
      summary: Get owned yacht slots and computed calendar state
      parameters:
        - name: yachtId
          in: query
          required: true
          schema: { type: string }
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Host calendar slots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityListResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /host/yachts/{id}/availability:
    post:
      operationId: setYachtAvailability
      tags: [host]
      summary: Set availability slots for a yacht
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityBatchInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityListResponse"

  /host/yachts/{id}/pricing:
    put:
      operationId: setYachtPricing
      tags: [host]
      summary: Set pricing for a yacht's booking templates
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingBatchInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingListResponse"

  /host/yachts/{id}/submit:
    post:
      operationId: submitYachtForReview
      tags: [host]
      summary: Submit a yacht for admin review
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Yacht"

  /host/earnings:
    get:
      operationId: getHostEarnings
      tags: [finance]
      summary: Get host earnings summary (includes totals and full ledger)
      responses:
        "200":
          description: Earnings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EarningsSummary"

  /host/earnings/ledger:
    get:
      operationId: getHostEarningsLedger
      tags: [finance]
      summary: Get host earnings ledger entries
      responses:
        "200":
          description: Ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EarningsLedgerListResponse"

  /host/earnings/withdraw:
    post:
      operationId: requestWithdrawViaEarnings
      tags: [finance]
      summary: Request a withdrawal (earnings-path alias)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalInput"
      responses:
        "201":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"
        "400":
          description: Insufficient available balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /host/withdrawals:
    get:
      operationId: listWithdrawals
      tags: [finance]
      summary: List withdrawal requests
      responses:
        "200":
          description: Withdrawals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalListResponse"
    post:
      operationId: requestWithdrawal
      tags: [finance]
      summary: Request a withdrawal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalInput"
      responses:
        "201":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"

  /host/documents:
    get:
      operationId: listHostDocuments
      tags: [host]
      summary: List documents uploaded by the current host applicant
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostDocumentListResponse"
    post:
      operationId: uploadHostDocument
      tags: [host]
      summary: Upload a verification document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostDocument"

  /host/photographer-request:
    post:
      operationId: requestPhotographer
      tags: [host]
      summary: Request a MARSA photographer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotographerRequestInput"
      responses:
        "201":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotographerRequest"

  # ── Notifications ──────────────────────────────────────────────────────────
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for the current user
      parameters:
        - name: unreadOnly
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /push-tokens:
    post:
      operationId: registerPushToken
      tags: [notifications]
