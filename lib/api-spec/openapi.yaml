        tripStartsAt: { type: string }
        timeZone: { type: string }
        rules:
          type: array
          items:
            $ref: "#/components/schemas/CancellationPolicyRule"
      required: [policyName, policyVersion, tripStartsAt, timeZone, rules]

    CancellationQuote:
