        requestedAt: { type: string }
        tripStartsAt: { type: string }
        remainingMinutes: { type: integer }
        policyVersion:
          type: ["integer", "null"]
        matchedRuleId:
          type: ["string", "null"]
        feePercentage:
          type: ["string", "null"]
        originalAmountEgp: { type: string }
        feeAmountEgp:
          type: ["string", "null"]
        refundAmountEgp:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, processing, approved, rejected, refund_failed]
        reviewedBy:
          type: ["string", "null"]
        reviewedAt:
          type: ["string", "null"]
        reviewNotes:
          type: ["string", "null"]
        manualReviewRequired: { type: boolean }
      required:
        [
          id,
          bookingId,
          requestedBy,
          requestedAt,
          tripStartsAt,
          remainingMinutes,
          policyVersion,
          matchedRuleId,
          feePercentage,
          originalAmountEgp,
          feeAmountEgp,
          refundAmountEgp,
          status,
          reviewedBy,
          reviewedAt,
          reviewNotes,
          manualReviewRequired,
        ]

    BookingCancellationListResponse:
      type: object
      properties:
        cancellations:
