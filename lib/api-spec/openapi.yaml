          schema: { type: string }
      responses:
        "200":
          description: Policy activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancellationPolicy"

  /admin/cancellations:
    get:
      operationId: adminListCancellations
      tags: [admin]
      summary: List durable cancellation requests
      parameters:
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Cancellation requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingCancellationListResponse"

  /admin/cancellations/{id}/process:
    post:
      operationId: adminProcessCancellation
      tags: [admin]
      summary: Approve, reject, or retry a cancellation request
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancellationProcessInput"
      responses:
        "200":
          description: Cancellation processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingCancellation"

  /webhooks/stripe:
    post:
      operationId: stripeWebhook
      tags: [bookings]
      summary: Stripe payment webhook
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

