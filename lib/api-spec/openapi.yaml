  # ── Storage ─────────────────────────────────────────────────────────────────
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned upload URL for direct client-side upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                size:
                  type: number
                contentType:
                  type: string
              required: [name, size, contentType]
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadURL:
                    type: string
                  objectPath:
                    type: string
                  metadata:
                    type: object
                    properties:
                      name:
                        type: string
                      size:
                        type: number
                      contentType:
                        type: string
                    required: [name, size, contentType]
                required: [uploadURL, objectPath, metadata]
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/uploads/finalize:
    post:
      operationId: finalizeUpload
      tags: [storage]
      summary: Set ACL ownership on an object after a direct presigned-URL upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                objectPath:
                  type: string
                visibility:
                  type: string
                  enum: [private, public]
              required: [objectPath]
      responses:
        "200":
          description: ACL set successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  objectPath:
                    type: string
                  owner:
                    type: string
                  visibility:
                    type: string
                required: [objectPath, owner, visibility]
        "400":
          description: Missing objectPath
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

