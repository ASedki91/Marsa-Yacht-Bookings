openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: MARSA Yacht Booking API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and user account sync
  - name: yachts
    description: Yacht listing and discovery
  - name: bookings
    description: Booking management
  - name: host
    description: Host management
  - name: admin
    description: Admin operations
  - name: reviews
    description: Reviews
  - name: notifications
    description: Notifications
  - name: finance
    description: Earnings and withdrawals

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Liveness check
      description: Returns server liveness status (no DB probe)
      responses:
        "200":
          description: Server is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /health:
    get:
      operationId: healthCheckDeep
      tags: [health]
      summary: Deep health check
      description: Validates DB connectivity. Returns 503 if unhealthy.
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeepHealthStatus"
        "503":
          description: Unhealthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeepHealthStatus"

  # ── Auth ────────────────────────────────────────────────────────────────────
  /auth/sync:
    post:
      operationId: syncUser
      tags: [auth]
      summary: Sync Clerk user to local database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSyncInput"
      responses:
        "200":
          description: User synced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSyncResponse"
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSyncResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Discovery ──────────────────────────────────────────────────────────────
  /yachts:
    get:
      operationId: listYachts
      tags: [yachts]
      summary: List live yachts
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: categoryId
          in: query
          schema: { type: string }
        - name: capacity
          in: query
          schema: { type: integer }
        - name: date
          in: query
          description: Filter by availability date (YYYY-MM-DD)
          schema: { type: string }
        - name: templateId
          in: query
          schema: { type: string }
        - name: minPrice
          in: query
          description: Minimum price in EGP (inclusive)
          schema: { type: number }
        - name: maxPrice
          in: query
          description: Maximum price in EGP (inclusive)
          schema: { type: number }
        - name: features
          in: query
          description: Comma-separated list of required features e.g. "wifi,ac"
          schema: { type: string }
      responses:
        "200":
          description: List of yachts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YachtListResponse"

  /yachts/{id}:
    get:
      operationId: getYacht
      tags: [yachts]
      summary: Get yacht details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Yacht detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YachtDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /yachts/{id}/slots:
    get:
      operationId: getYachtSlots
      tags: [yachts]
      summary: Get available slots for a yacht (path-param version)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
        - name: templateId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Available slots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityListResponse"

  /yachts/availability:
    get:
      operationId: getYachtAvailability
      tags: [yachts]
      summary: Get available slots for a yacht
      parameters:
        - name: yachtId
          in: query
          required: true
          schema: { type: string }
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Available slots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityListResponse"

  /categories:
    get:
      operationId: listCategories
      tags: [yachts]
      summary: List yacht categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"

  /booking-templates:
    get:
      operationId: listBookingTemplates
      tags: [yachts]
      summary: List all booking duration templates
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingTemplateListResponse"

  /add-ons:
    get:
      operationId: listAddOns
      tags: [yachts]
      summary: List all available add-ons
      responses:
        "200":
          description: Add-ons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddOnListResponse"

  /exchange-rate:
    get:
      operationId: getExchangeRate
      tags: [yachts]
      summary: Get current USD/EGP exchange rate
      responses:
        "200":
          description: Exchange rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeRateResponse"

  # ── Bookings ────────────────────────────────────────────────────────────────
  /bookings/me:
    get:
      operationId: getMyBookings
      tags: [bookings]
      summary: Get the current guest's bookings (dedicated alias)
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        "200":
          description: Guest bookings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings:
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a booking and get Stripe PaymentIntent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingCreateResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listMyBookings
      tags: [bookings]
      summary: List the current user's bookings
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [guest, host]
        - name: status
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        "200":
          description: Bookings list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingListResponse"

  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get booking details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Booking detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings/{id}/cancel:
    post:
      operationId: cancelBooking
      tags: [bookings]
      summary: Request booking cancellation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancellationInput"
      responses:
        "200":
          description: Cancellation requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /bookings/{id}/confirm:
    post:
      operationId: confirmBooking
      tags: [bookings]
      summary: Host confirms a booking
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /bookings/{id}/reject:
    post:
      operationId: rejectBooking
      tags: [bookings]
      summary: Host rejects a booking (triggers refund)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectionInput"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /bookings/{id}/review:
    post:
      operationId: submitReview
      tags: [reviews]
      summary: Submit a review for a completed booking
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Review submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  # ── Host ───────────────────────────────────────────────────────────────────
  /host/apply:
    post:
      operationId: applyAsHost
      tags: [host]
      summary: Apply to become a host
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostApplicationInput"
      responses:
        "201":
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostProfile"

  /host/profile:
    get:
      operationId: getHostProfile
      tags: [host]
      summary: Get authenticated host's profile
      responses:
        "200":
          description: Host profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostProfile"
    patch:
      operationId: updateHostProfile
      tags: [host]
      summary: Update host profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostProfileUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostProfile"

  /host/yachts:
    get:
      operationId: listHostYachts
      tags: [host]
      summary: List the host's own yachts
      responses:
        "200":
          description: Host yachts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YachtListResponse"
    post:
      operationId: createYacht
      tags: [host]
      summary: Create a new yacht listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YachtInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Yacht"

  /host/yachts/{id}:
    patch:
      operationId: updateYacht
      tags: [host]
      summary: Update a yacht listing
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YachtUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Yacht"

  /host/yachts/{id}/availability:
    post:
      operationId: setYachtAvailability
      tags: [host]
      summary: Set availability slots for a yacht
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityBatchInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityListResponse"

  /host/yachts/{id}/pricing:
    put:
      operationId: setYachtPricing
      tags: [host]
      summary: Set pricing for a yacht's booking templates
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingBatchInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingListResponse"

  /host/yachts/{id}/submit:
    post:
      operationId: submitYachtForReview
      tags: [host]
      summary: Submit a yacht for admin review
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Yacht"

  /host/earnings:
    get:
      operationId: getHostEarnings
      tags: [finance]
      summary: Get host earnings summary
      responses:
        "200":
          description: Earnings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EarningsSummary"

  /host/withdrawals:
    get:
      operationId: listWithdrawals
      tags: [finance]
      summary: List withdrawal requests
      responses:
        "200":
          description: Withdrawals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalListResponse"
    post:
      operationId: requestWithdrawal
      tags: [finance]
      summary: Request a withdrawal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalInput"
      responses:
        "201":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"

  /host/documents:
    get:
      operationId: listHostDocuments
      tags: [host]
      summary: List documents uploaded by the current host applicant
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostDocumentListResponse"
    post:
      operationId: uploadHostDocument
      tags: [host]
      summary: Upload a verification document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostDocument"

  /host/photographer-request:
    post:
      operationId: requestPhotographer
      tags: [host]
      summary: Request a MARSA photographer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotographerRequestInput"
      responses:
        "201":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotographerRequest"

  # ── Notifications ──────────────────────────────────────────────────────────
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for the current user
      parameters:
        - name: unreadOnly
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  # ── Admin ───────────────────────────────────────────────────────────────────
  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: List all users
      parameters:
        - name: page
          in: query
          schema: { type: integer }
        - name: role
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"

  /admin/users/{id}/role:
    patch:
      operationId: adminSetUserRole
      tags: [admin]
      summary: Change a user's role
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /admin/yachts:
    get:
      operationId: adminListYachts
      tags: [admin]
      summary: List all yachts (any status)
      responses:
        "200":
          description: Yachts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YachtListResponse"

  /admin/yachts/{id}/approve:
    post:
      operationId: adminApproveYacht
      tags: [admin]
      summary: Approve a yacht listing
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Yacht"

  /admin/yachts/{id}/reject:
    post:
      operationId: adminRejectYacht
      tags: [admin]
      summary: Reject a yacht listing
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectionInput"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Yacht"

  /admin/bookings:
    get:
      operationId: adminListBookings
      tags: [admin]
      summary: List all bookings
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Bookings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingListResponse"

  /admin/hosts:
    get:
      operationId: adminListHosts
      tags: [admin]
      summary: List all host applications
      parameters:
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Hosts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostProfileListResponse"

  /admin/hosts/{id}/verify:
    post:
      operationId: adminVerifyHost
      tags: [admin]
      summary: Approve or reject a host application
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostVerificationInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostProfile"

  /admin/withdrawals:
    get:
      operationId: adminListWithdrawals
      tags: [admin]
      summary: List all withdrawal requests
      responses:
        "200":
          description: Withdrawals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalListResponse"

  /admin/withdrawals/{id}/process:
    post:
      operationId: adminProcessWithdrawal
      tags: [admin]
      summary: Mark a withdrawal as paid or rejected
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalProcessInput"
      responses:
        "200":
          description: Processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"

  /admin/reviews:
    get:
      operationId: adminListReviews
      tags: [admin]
      summary: List all reviews for moderation
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewListResponse"

  /admin/reviews/{id}/moderate:
    post:
      operationId: adminModerateReview
      tags: [admin]
      summary: Approve or hide a review
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewModerationInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  /admin/audit-logs:
    get:
      operationId: adminListAuditLogs
      tags: [admin]
      summary: List audit logs
      parameters:
        - name: entityType
          in: query
          schema: { type: string }
        - name: entityId
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Dashboard statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/documents:
    get:
      operationId: adminListDocuments
      tags: [admin]
      summary: List host verification documents
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected] }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostDocumentListResponse"

