        feePercentage:
          type: ["string", "null"]
        originalAmountEgp: { type: string }
        feeAmountEgp:
          type: ["string", "null"]
        refundAmountEgp:
          type: ["string", "null"]
        manualReviewRequired: { type: boolean }
      required:
        [
          bookingId,
          tripStartsAt,
          requestedAt,
          remainingMinutes,
          matchedRuleId,
          feePercentage,
          originalAmountEgp,
          feeAmountEgp,
          refundAmountEgp,
          manualReviewRequired,
        ]

    CancellationQuoteConflict:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
