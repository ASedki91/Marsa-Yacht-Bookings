kind = "mobile"
previewPath = "/marsa-mobile/"
title = "MARSA Mobile"
version = "1.0.0"
id = "artifacts/marsa-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/marsa-mobile/" ]
localPort = 20933

[services.development]
run = "pnpm --filter @workspace/marsa-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/marsa-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/marsa-mobile", "run", "serve" ]

[services.env]
PORT = "20933"
BASE_PATH = "/marsa-mobile/"
